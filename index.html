<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rewire 3.0 — Strong with Sherni</title>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', sans-serif; }
  input:focus { outline: 2px solid #D99A0B; outline-offset: 1px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;
const { createClient } = window.supabase;

// ---- Supabase connection ----
const SUPABASE_URL = "https://qwewomevylwwzvjerpxo.supabase.co";
const SUPABASE_KEY = "sb_publishable__t2oQ21hEs93NSrUJsSLSQ_YYmnXNu1";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// ---- Design tokens ----
const C = {
  paper: "#FBF8F1", surface: "#FFFFFF", line: "#E7E1D2",
  ink: "#2C2A22", inkSoft: "#726C5B", inkFaint: "#A39C89",
  gold: "#D99A0B", goldSoft: "#F4E3B8",
  jungle: "#3E6355", jungleSoft: "#DEE9E1",
  brick: "#B84A3E", brickSoft: "#F3DFDA",
};
const inputStyle = {
  padding: "12px 14px", borderRadius: 10, border: `1px solid ${C.line}`,
  background: C.surface, color: C.ink, fontFamily: "'Inter', sans-serif", fontSize: 14,
};

// ---- Habits (merged from the guidelines doc + live tracking sheet) ----
const PILLARS = [
  { id: "mind", label: "Mind", habits: [
    { id: "meditation", label: "Meditation", type: "toggle", points: 2, hint: "Min 10 minutes, any style" },
    { id: "journaling", label: "Journaling", type: "toggle", points: 2, hint: "Gratitude, reflection or daily aims" },
    { id: "pranayama", label: "Pranayama", type: "toggle", points: 1, hint: "Daily breathing practice" },
  ]},
  { id: "body", label: "Body", habits: [
    { id: "training", label: "Physical activity", type: "toggle", points: 2, hint: "Workout session completed" },
    { id: "steps", label: "Steps", type: "number", points: 1, unit: "steps", target: 10000, step: 500, hint: "10,000 a day" },
    { id: "sleep", label: "Sleep", type: "number", points: 2, unit: "hrs", scoredByCoach: true, step: 0.25, hint: "Log your hours — your coach scores this one" },
    { id: "hydration", label: "Hydration", type: "number", points: 1, unit: "glasses", target: 8, step: 1, hint: "8–10 glasses" },
    { id: "nutrition", label: "Nutrition log", type: "photos", points: 1, hint: "Add a photo for each meal or snack" },
    { id: "supplementation", label: "Supplementation", type: "toggle", points: 2, hint: "Vitamin B12 and B3" },
    { id: "malasana", label: "Malasana & sun exposure", type: "toggle", points: 1, hint: "Daily hold, plus 5 min sun exposure" },
  ]},
  { id: "growth", label: "Growth", habits: [
    { id: "reading", label: "Reading", type: "number", points: 2, unit: "pages", target: 10, step: 1, hint: "Non-fiction preferred, 10 pages min" },
    { id: "screentime", label: "Screen time & phone curfew", type: "toggle", points: 2, hint: "Under 1 hour on social apps" },
  ]},
];
const ALL_HABITS = PILLARS.flatMap(p => p.habits);
const MAX_DAILY_POINTS = ALL_HABITS.reduce((s, h) => s + h.points, 0);
const WEEKLY_TARGET = 100;
// Each habit's weekly points cap at roughly a 5.5-day equivalent, per the original design —
// so a perfect 7-day week doesn't exceed the target, it just hits it comfortably.
const WEEKLY_CAP = {
  meditation: 10, journaling: 10, pranayama: 5, training: 10, steps: 5,
  sleep: 10, hydration: 5, nutrition: 5, supplementation: 10, malasana: 5,
  reading: 10, screentime: 10,
};
// Sums a week's daily rows into a capped weekly total (plus that week's physique points).
// Falls back to raw daily points for any older rows saved before per-habit breakdowns existed.
function weeklyPointsFromRows(rows, physiquePoints) {
  const perHabit = {};
  ALL_HABITS.forEach(h => { perHabit[h.id] = 0; });
  let fallback = 0;
  rows.forEach(r => {
    if (r.habit_points && Object.keys(r.habit_points).length > 0) {
      ALL_HABITS.forEach(h => { perHabit[h.id] += Number(r.habit_points[h.id] || 0); });
    } else {
      fallback += r.points || 0;
    }
  });
  let total = fallback;
  ALL_HABITS.forEach(h => { total += Math.min(perHabit[h.id], WEEKLY_CAP[h.id]); });
  return total + Number(physiquePoints || 0);
}
const TOTAL_DAYS = 60;

// Default points for a habit given its logged value.
// Coach-scored habits (like sleep) always default to 0 — the admin assigns these manually.
function defaultPointsForHabit(h, v) {
  if (h.scoredByCoach) return 0;
  if (h.type === "toggle") return v ? h.points : 0;
  if (h.type === "number") return Number(v || 0) >= h.target ? h.points : 0;
  if (h.type === "photo") return v ? h.points : 0;
  if (h.type === "photos") return v && v.length > 0 ? h.points : 0;
  return 0;
}
// Merge stored per-habit overrides with computed defaults.
function resolveHabitPoints(values, habitPoints) {
  const out = {};
  ALL_HABITS.forEach(h => {
    out[h.id] = habitPoints && habitPoints[h.id] !== undefined ? habitPoints[h.id] : defaultPointsForHabit(h, values[h.id]);
  });
  return out;
}
function sumPoints(pointsMap) { return Object.values(pointsMap).reduce((s, p) => s + Number(p || 0), 0); }

const START_DATE = new Date("2026-08-03T00:00:00");
function formatLocalDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function dateForDay(d) {
  const dt = new Date(START_DATE.getTime() + (d - 1) * 86400000);
  return formatLocalDate(dt);
}

function todayStr() { return formatLocalDate(new Date()); }
function dayNumberFor(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return Math.floor((d - START_DATE) / 86400000) + 1;
}
function currentDay() { return Math.min(TOTAL_DAYS, Math.max(1, dayNumberFor(todayStr()))); }
function weekForDay(d) { return Math.min(8, Math.max(1, Math.ceil(d / 7))); }
function phaseForDay(day) { return day <= 20 ? "Foundation" : day <= 40 ? "Momentum" : "Mastery"; }

// ---- Shared components ----
function Trail({ day }) {
  const segments = [{ name: "Foundation" }, { name: "Momentum" }, { name: "Mastery" }];
  const pct = (day / TOTAL_DAYS) * 100;
  const phase = phaseForDay(day);
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
        {segments.map(s => (
          <span key={s.name} style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 12, fontWeight: 500, color: s.name === phase ? C.ink : C.inkFaint }}>{s.name}</span>
        ))}
      </div>
      <div style={{ position: "relative", height: 8, borderRadius: 5, background: C.line }}>
        <div style={{ position: "absolute", left: "33.33%", top: 0, bottom: 0, width: 1, background: C.paper }} />
        <div style={{ position: "absolute", left: "66.66%", top: 0, bottom: 0, width: 1, background: C.paper }} />
        <div style={{ width: `${pct}%`, height: "100%", borderRadius: 5, background: C.gold }} />
        <div style={{ position: "absolute", left: `calc(${pct}% - 8px)`, top: -5, width: 18, height: 18, borderRadius: "50%", background: C.surface, border: `3px solid ${C.gold}` }} />
      </div>
    </div>
  );
}

function Toggle({ checked, onChange }) {
  return (
    <button onClick={() => onChange(!checked)} style={{
      width: 24, height: 24, borderRadius: "50%", flexShrink: 0,
      border: `1.5px solid ${checked ? C.jungle : C.inkFaint}`,
      background: checked ? C.jungle : "transparent",
      display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer",
    }}>
      {checked && <span style={{ color: C.surface, fontSize: 13, fontWeight: 700 }}>✓</span>}
    </button>
  );
}

function PhotoGallery({ value, onChange, userId, day }) {
  const photos = value || [];
  const [uploading, setUploading] = useState(false);
  const inputId = useMemo(() => "gallery-" + Math.random().toString(36).slice(2), []);

  const handleFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setUploading(true);
    const path = `${userId}/day-${day}-${Date.now()}.jpg`;
    const { error } = await sb.storage.from("nutrition-photos").upload(path, file, { upsert: true });
    if (!error) {
      const { data } = sb.storage.from("nutrition-photos").getPublicUrl(path);
      onChange([...photos, data.publicUrl]);
    } else {
      alert("Photo upload failed: " + error.message);
    }
    setUploading(false);
    e.target.value = "";
  };
  const removePhoto = (idx) => onChange(photos.filter((_, i) => i !== idx));

  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 6, maxWidth: 160, justifyContent: "flex-end" }}>
      {photos.map((url, i) => (
        <div key={i} style={{ position: "relative" }}>
          <img src={url} alt={`Meal ${i + 1}`} style={{ width: 36, height: 36, borderRadius: 7, objectFit: "cover" }} />
          <button onClick={() => removePhoto(i)} style={{
            position: "absolute", top: -5, right: -5, width: 15, height: 15, borderRadius: "50%",
            background: C.brick, color: "#fff", border: "none", fontSize: 9, lineHeight: "15px", padding: 0, cursor: "pointer",
          }}>×</button>
        </div>
      ))}
      <label htmlFor={inputId} style={{ cursor: "pointer" }}>
        <input id={inputId} type="file" accept="image/*" style={{ display: "none" }} onChange={handleFile} />
        <div style={{ width: 36, height: 36, borderRadius: 7, border: `1.5px dashed ${C.inkFaint}`, display: "flex", alignItems: "center", justifyContent: "center", color: C.inkFaint, fontSize: 15 }}>
          {uploading ? "…" : "+"}
        </div>
      </label>
    </div>
  );
}

function PhotoTile({ value, onChange, userId, day }) {
  const [uploading, setUploading] = useState(false);
  const inputId = useMemo(() => "photo-" + Math.random().toString(36).slice(2), []);
  const handleFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setUploading(true);
    const path = `${userId}/day-${day}-${Date.now()}.jpg`;
    const { error } = await sb.storage.from("nutrition-photos").upload(path, file, { upsert: true });
    if (!error) {
      const { data } = sb.storage.from("nutrition-photos").getPublicUrl(path);
      onChange(data.publicUrl);
    } else {
      alert("Photo upload failed: " + error.message);
    }
    setUploading(false);
  };
  return (
    <label htmlFor={inputId} style={{ cursor: "pointer" }}>
      <input id={inputId} type="file" accept="image/*" style={{ display: "none" }} onChange={handleFile} />
      {uploading ? (
        <div style={{ width: 40, height: 40, borderRadius: 8, border: `1.5px dashed ${C.inkFaint}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 9, color: C.inkFaint }}>…</div>
      ) : value ? (
        <img src={value} alt="Meal log" style={{ width: 40, height: 40, borderRadius: 8, objectFit: "cover" }} />
      ) : (
        <div style={{ width: 40, height: 40, borderRadius: 8, border: `1.5px dashed ${C.inkFaint}`, display: "flex", alignItems: "center", justifyContent: "center", color: C.inkFaint, fontSize: 16 }}>+</div>
      )}
    </label>
  );
}

function HabitRow({ habit, value, onChange, last, userId, day }) {
  const done = habit.scoredByCoach ? Number(value || 0) > 0
    : habit.type === "toggle" ? !!value
    : habit.type === "number" ? Number(value || 0) >= habit.target
    : habit.type === "photos" ? !!(value && value.length > 0)
    : !!value;
  const isPhotoType = habit.type === "photo" || habit.type === "photos";
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 14, padding: "14px 0", borderBottom: last ? "none" : `1px solid ${C.line}` }}>
      {isPhotoType ? (
        <span style={{ width: 24, height: 24, borderRadius: "50%", flexShrink: 0, border: `1.5px solid ${done ? C.jungle : C.inkFaint}`, background: done ? C.jungle : "transparent", display: "flex", alignItems: "center", justifyContent: "center" }}>
          {done && <span style={{ color: C.surface, fontSize: 13, fontWeight: 700 }}>✓</span>}
        </span>
      ) : (
        <Toggle checked={done} onChange={(v) => {
          if (habit.type === "toggle") onChange(v);
          else if (habit.type === "number" && !habit.scoredByCoach) onChange(v ? habit.target : 0);
          else onChange(v);
        }} />
      )}
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
          <span style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 500, color: C.ink }}>{habit.label}</span>
          {habit.scoredByCoach ? (
            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, color: C.inkFaint }}>scored by coach</span>
          ) : (
            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: C.gold }}>+{habit.points}</span>
          )}
        </div>
        <div style={{ fontSize: 12, color: C.inkFaint, marginTop: 2 }}>{habit.hint}</div>
      </div>
      {habit.type === "number" && (
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <input type="number" step={habit.step} value={value || ""} onChange={(e) => onChange(e.target.value)} placeholder="0"
            style={{ width: 70, background: C.paper, border: `1px solid ${C.line}`, borderRadius: 8, padding: "6px 8px", color: C.ink, fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, textAlign: "right" }} />
          <span style={{ fontSize: 11, color: C.inkFaint, width: 36 }}>{habit.unit}</span>
        </div>
      )}
      {habit.type === "photo" && <PhotoTile value={value} onChange={onChange} userId={userId} day={day} />}
      {habit.type === "photos" && <PhotoGallery value={value} onChange={onChange} userId={userId} day={day} />}
    </div>
  );
}

function StatChip({ label, value, tone }) {
  const bg = tone === "gold" ? C.goldSoft : tone === "jungle" ? C.jungleSoft : C.paper;
  const fg = tone === "gold" ? "#8A5F06" : tone === "jungle" ? "#274539" : C.ink;
  return (
    <div style={{ background: bg, borderRadius: 12, padding: "12px 14px", flex: 1 }}>
      <div style={{ fontSize: 11, color: C.inkFaint, textTransform: "uppercase", letterSpacing: 0.5 }}>{label}</div>
      <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 21, fontWeight: 600, color: fg, marginTop: 3 }}>{value}</div>
    </div>
  );
}

function RecapRow({ habit, value }) {
  const done = habit.scoredByCoach ? Number(value || 0) > 0
    : habit.type === "toggle" ? !!value
    : habit.type === "number" ? Number(value || 0) >= habit.target
    : habit.type === "photos" ? !!(value && value.length > 0)
    : !!value;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0" }}>
      <span style={{ width: 20, height: 20, borderRadius: "50%", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", background: done ? C.jungleSoft : C.brickSoft, color: done ? C.jungle : C.brick, fontSize: 12, fontWeight: 700 }}>{done ? "✓" : "✕"}</span>
      <span style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 13, color: C.ink, flex: 1 }}>{habit.label}</span>
      {habit.type === "number" && Number(value || 0) > 0 && (
        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: C.inkFaint }}>{value}{habit.unit === "steps" ? "" : ` ${habit.unit}`}</span>
      )}
    </div>
  );
}

function RecapCard({ values, day, earned }) {
  const contentRef = useRef(null);
  const [sharing, setSharing] = useState(false);
  const photo = values.nutrition;

  const handleShare = async () => {
    if (!contentRef.current) return;
    setSharing(true);
    try {
      const canvas = await html2canvas(contentRef.current, { backgroundColor: C.surface, scale: 2, useCORS: true });
      canvas.toBlob(async (blob) => {
        if (!blob) { setSharing(false); return; }
        const file = new File([blob], `rewire-day-${day}.png`, { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try { await navigator.share({ files: [file], title: `Rewire 3.0 — Day ${day}` }); }
          catch (e) { /* user cancelled share sheet */ }
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url; a.download = `rewire-day-${day}.png`;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }
        setSharing(false);
      }, "image/png");
    } catch (e) {
      alert("Couldn't generate the image: " + e.message);
      setSharing(false);
    }
  };

  return (
    <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 16, padding: "1.5rem", marginBottom: 24 }}>
      <div ref={contentRef} style={{ background: C.surface }}>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 16 }}>
          <div>
            <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 19, fontWeight: 700, color: C.ink }}>Day {day} recap</div>
            <div style={{ fontSize: 12, color: C.inkFaint, marginTop: 2 }}>{phaseForDay(day)} phase</div>
          </div>
          <div style={{ background: C.goldSoft, color: "#8A5F06", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, padding: "6px 12px", borderRadius: 20 }}>{earned}/{MAX_DAILY_POINTS} pts</div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", columnGap: 20 }}>
          {ALL_HABITS.map(h => <RecapRow key={h.id} habit={h} value={values[h.id]} />)}
        </div>
        {photo && photo.length > 0 && (
          <div style={{ marginTop: 14, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            {photo.map((url, i) => (
              <img key={i} src={url} alt={`Meal ${i + 1}`} crossOrigin="anonymous" style={{ width: 40, height: 40, borderRadius: 8, objectFit: "cover" }} />
            ))}
            <span style={{ fontSize: 12, color: C.inkFaint }}>Today's nutrition log</span>
          </div>
        )}
        <div style={{ marginTop: 18, paddingTop: 16, borderTop: `1px solid ${C.line}` }}>
          <span style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 13, fontStyle: "italic", color: C.inkSoft }}>Small wins, stacked daily.</span>
        </div>
      </div>
      <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 12 }}>
        <button onClick={handleShare} disabled={sharing} style={{ padding: "8px 16px", borderRadius: 10, border: `1px solid ${C.line}`, background: C.paper, color: C.ink, fontFamily: "'Space Grotesk', sans-serif", fontSize: 12, fontWeight: 500, cursor: "pointer" }}>
          {sharing ? "Preparing…" : "Share recap"}
        </button>
      </div>
    </div>
  );
}

// ---- Check-in tab ----
function CheckIn({ session }) {
  const todayNum = currentDay();
  const [viewDay, setViewDay] = useState(todayNum);
  const [values, setValues] = useState({});
  const [habitPoints, setHabitPoints] = useState({});
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);
  const isToday = viewDay === todayNum;

  useEffect(() => {
    setLoading(true);
    setSaved(false);
    (async () => {
      const { data } = await sb.from("daily_checkins").select("*").eq("user_id", session.user.id).eq("day", dateForDay(viewDay)).maybeSingle();
      if (data) {
        setValues({
          meditation: data.meditation, journaling: data.journaling, pranayama: data.pranayama, training: data.training,
          steps: data.steps || "", sleep: data.sleep || "", hydration: data.hydration || "",
          nutrition: data.nutrition_photos || [], supplementation: data.supplementation, malasana: data.malasana,
          reading: data.reading || "", screentime: data.screentime,
        });
        setHabitPoints(data.habit_points || {});
      } else {
        setValues({});
        setHabitPoints({});
      }
      setLoading(false);
    })();
  }, [viewDay]);

  const set = (id, v) => { setValues(s => ({ ...s, [id]: v })); setSaved(false); };
  const resolved = resolveHabitPoints(values, habitPoints);
  const earned = sumPoints(resolved);

  const handleSave = async () => {
    setSaving(true);
    const newHabitPoints = resolveHabitPoints(values, habitPoints);
    const row = {
      user_id: session.user.id, day: dateForDay(viewDay),
      meditation: !!values.meditation, journaling: !!values.journaling, pranayama: !!values.pranayama, training: !!values.training,
      steps: Number(values.steps || 0), sleep: Number(values.sleep || 0), hydration: Number(values.hydration || 0),
      nutrition_photos: values.nutrition || [], supplementation: !!values.supplementation, malasana: !!values.malasana,
      reading: Number(values.reading || 0), screentime: !!values.screentime,
      habit_points: newHabitPoints, points: sumPoints(newHabitPoints),
    };
    const { error } = await sb.from("daily_checkins").upsert(row, { onConflict: "user_id,day" });
    setSaving(false);
    if (error) alert("Save failed: " + error.message); else { setHabitPoints(newHabitPoints); setSaved(true); }
  };

  return (
    <div>
      <div style={{ marginBottom: 24 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <button onClick={() => setViewDay(d => Math.max(1, d - 1))} disabled={viewDay <= 1} style={{ width: 26, height: 26, borderRadius: 8, border: `1px solid ${C.line}`, background: C.surface, cursor: viewDay <= 1 ? "default" : "pointer", color: viewDay <= 1 ? C.inkFaint : C.ink }}>‹</button>
            <span style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 17, fontWeight: 600, color: C.ink }}>{isToday ? `Day ${viewDay} of ${TOTAL_DAYS}` : `Day ${viewDay}`}</span>
            <button onClick={() => setViewDay(d => Math.min(todayNum, d + 1))} disabled={isToday} style={{ width: 26, height: 26, borderRadius: 8, border: `1px solid ${C.line}`, background: C.surface, cursor: isToday ? "default" : "pointer", color: isToday ? C.inkFaint : C.ink }}>›</button>
          </div>
          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: C.gold }}>{earned}/{MAX_DAILY_POINTS} {isToday ? "today" : ""}</span>

        {!isToday && (
          <div style={{ fontSize: 12, color: C.inkFaint, marginBottom: 10 }}>
            Editing {dateForDay(viewDay)} · <button onClick={() => setViewDay(todayNum)} style={{ border: "none", background: "none", color: C.gold, cursor: "pointer", padding: 0, fontSize: 12, textDecoration: "underline" }}>jump to today</button>
          </div>
        )}
        <Trail day={viewDay} />
      </div>

      {loading ? (
        <div style={{ color: C.inkFaint, fontSize: 13 }}>Loading…</div>
      ) : (
        <React.Fragment>
          {PILLARS.map(pillar => (
            <div key={pillar.id} style={{ marginBottom: 22 }}>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 12, fontWeight: 600, color: C.inkFaint, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 }}>{pillar.label}</div>
              <div>
                {pillar.habits.map((h, i) => (
                  <HabitRow key={h.id} habit={h} value={values[h.id]} onChange={(v) => set(h.id, v)} last={i === pillar.habits.length - 1} userId={session.user.id} day={viewDay} />
                ))}
              </div>
            </div>
          ))}
          <button onClick={handleSave} disabled={saving} style={{ marginTop: 6, width: "100%", padding: "15px", borderRadius: 12, border: "none", background: saved ? C.jungle : C.ink, color: C.paper, fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 600, cursor: "pointer" }}>
            {saving ? "Saving…" : saved ? "Saved ✓" : isToday ? "Save today's check-in" : `Save Day ${viewDay}`}
          </button>
        </React.Fragment>
      )}
    </div>
  );
}

// ---- Report card tab ----
function ReportCard({ session }) {
  const [checkins, setCheckins] = useState([]);
  const [weeklyPhysique, setWeeklyPhysique] = useState([]);
  const [loading, setLoading] = useState(true);
  const day = currentDay();
  const [recapDay, setRecapDay] = useState(day);

  useEffect(() => {
    (async () => {
      const [{ data: dc }, { data: wc }] = await Promise.all([
        sb.from("daily_checkins").select("*").eq("user_id", session.user.id).order("day"),
        sb.from("weekly_checkins").select("*").eq("user_id", session.user.id),
      ]);
      setCheckins(dc || []);
      setWeeklyPhysique(wc || []);
      setLoading(false);
    })();
  }, []);

  const byDay = useMemo(() => { const m = {}; checkins.forEach(c => m[dayNumberFor(c.day)] = c); return m; }, [checkins]);
  const byWeek = useMemo(() => { const m = {}; weeklyPhysique.forEach(w => m[w.week] = w); return m; }, [weeklyPhysique]);

  let streak = 0;
  for (let d = day; d >= 1; d--) { const c = byDay[d]; if (c && c.points > 0) streak++; else break; }

  const days = Array.from({ length: TOTAL_DAYS }, (_, i) => {
    const d = i + 1;
    if (d > day) return { day: d, pct: null };
    const c = byDay[d];
    return { day: d, pct: c ? Math.round((c.points / MAX_DAILY_POINTS) * 100) : 0 };
  });

  const weeks = Array.from({ length: 8 }, (_, w) => {
    const wk = w + 1;
    const start = w * 7 + 1;
    if (start > day) return { week: wk, points: null };
    const rows = [];
    for (let d = start; d <= Math.min(start + 6, day); d++) { if (byDay[d]) rows.push(byDay[d]); }
    return { week: wk, points: weeklyPointsFromRows(rows, byWeek[wk]?.points) };
  });

  const totalPoints = weeks.reduce((s, w) => s + (w.points || 0), 0);

  const recapValues = useMemo(() => {
    const c = byDay[recapDay];
    if (!c) return {};
    return {
      meditation: c.meditation, journaling: c.journaling, pranayama: c.pranayama, training: c.training,
      steps: c.steps, sleep: c.sleep, hydration: c.hydration, nutrition: c.nutrition_photos || [],
      supplementation: c.supplementation, malasana: c.malasana, reading: c.reading, screentime: c.screentime,
    };
  }, [byDay, recapDay]);

  const cellColor = (pct) => pct === null ? C.line : pct >= 80 ? C.jungle : pct >= 50 ? C.gold : C.brick;

  if (loading) return <div style={{ color: C.inkFaint, fontSize: 13 }}>Loading your report card…</div>;

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "flex-end", gap: 8, marginBottom: 10 }}>
        <button onClick={() => setRecapDay(d => Math.max(1, d - 1))} disabled={recapDay <= 1} style={{ width: 26, height: 26, borderRadius: 8, border: `1px solid ${C.line}`, background: C.surface, cursor: recapDay <= 1 ? "default" : "pointer", color: recapDay <= 1 ? C.inkFaint : C.ink }}>‹</button>
        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: C.inkFaint }}>{recapDay === day ? "Today" : `Day ${recapDay}`}</span>
        <button onClick={() => setRecapDay(d => Math.min(day, d + 1))} disabled={recapDay >= day} style={{ width: 26, height: 26, borderRadius: 8, border: `1px solid ${C.line}`, background: C.surface, cursor: recapDay >= day ? "default" : "pointer", color: recapDay >= day ? C.inkFaint : C.ink }}>›</button>
      </div>
      <RecapCard values={recapValues} day={recapDay} earned={byDay[recapDay]?.points ?? 0} />
      <div style={{ display: "flex", gap: 10, marginBottom: 22 }}>
        <StatChip label="Total points" value={totalPoints} tone="gold" />
        <StatChip label="Streak" value={`${streak} days`} tone="jungle" />
        <StatChip label="Phase" value={phaseForDay(day)} />
      </div>
      <div style={{ marginBottom: 24 }}>
        <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 600, color: C.ink, marginBottom: 12 }}>60-day log</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(10, 1fr)", gap: 6 }}>
          {days.map(d => <div key={d.day} title={`Day ${d.day}${d.pct !== null ? `: ${d.pct}%` : ""}`} style={{ aspectRatio: "1", borderRadius: 5, background: cellColor(d.pct) }} />)}
        </div>
        <div style={{ display: "flex", gap: 16, marginTop: 12, fontSize: 11, color: C.inkFaint }}>
          <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 9, height: 9, borderRadius: 2, background: C.jungle, display: "inline-block" }} />80%+</span>
          <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 9, height: 9, borderRadius: 2, background: C.gold, display: "inline-block" }} />50–79%</span>
          <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 9, height: 9, borderRadius: 2, background: C.brick, display: "inline-block" }} />Under 50%</span>
          <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 9, height: 9, borderRadius: 2, background: C.line, display: "inline-block" }} />Upcoming</span>
        </div>
      </div>
      <div>
        <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 600, color: C.ink, marginBottom: 12 }}>Weekly totals · target {WEEKLY_TARGET}</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 11 }}>
          {weeks.map(w => (
            <div key={w.week} style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ width: 46, fontSize: 12, color: C.inkSoft, fontFamily: "'IBM Plex Mono', monospace" }}>Wk {w.week}</div>
              <div style={{ flex: 1, height: 7, borderRadius: 4, background: C.line, overflow: "hidden" }}>
                {w.points !== null && <div style={{ width: `${Math.min(100, w.points)}%`, height: "100%", background: w.points >= WEEKLY_TARGET ? C.jungle : C.gold }} />}
              </div>
              <div style={{ width: 36, textAlign: "right", fontSize: 12, fontFamily: "'IBM Plex Mono', monospace", color: w.points === null ? C.inkFaint : C.ink }}>{w.points === null ? "—" : w.points}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function AdminDayEditor({ client, day, setDay }) {
  const [values, setValues] = useState({});
  const [habitPoints, setHabitPoints] = useState({});
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);

  useEffect(() => {
    setLoading(true);
    setSaved(false);
    (async () => {
      const { data } = await sb.from("daily_checkins").select("*").eq("user_id", client.id).eq("day", dateForDay(day)).maybeSingle();
      const newValues = data ? {
        meditation: data.meditation, journaling: data.journaling, pranayama: data.pranayama, training: data.training,
        steps: data.steps || "", sleep: data.sleep || "", hydration: data.hydration || "",
        nutrition: data.nutrition_photos || [], supplementation: data.supplementation, malasana: data.malasana,
        reading: data.reading || "", screentime: data.screentime,
      } : {};
      setValues(newValues);
      setHabitPoints(resolveHabitPoints(newValues, data?.habit_points || {}));
      setLoading(false);
    })();
  }, [day, client.id]);

  const setValue = (id, v) => {
    setValues(s => {
      const next = { ...s, [id]: v };
      // if this habit's points hasn't been manually touched away from its default, keep it in sync
      const habit = ALL_HABITS.find(h => h.id === id);
      setHabitPoints(hp => {
        const wasDefault = hp[id] === defaultPointsForHabit(habit, s[id]);
        if (wasDefault) return { ...hp, [id]: defaultPointsForHabit(habit, v) };
        return hp;
      });
      return next;
    });
    setSaved(false);
  };
  const setPoints = (id, p) => { setHabitPoints(hp => ({ ...hp, [id]: p })); setSaved(false); };

  const earned = sumPoints(habitPoints);

  const handleSave = async () => {
    setSaving(true);
    const row = {
      user_id: client.id, day: dateForDay(day),
      meditation: !!values.meditation, journaling: !!values.journaling, pranayama: !!values.pranayama, training: !!values.training,
      steps: Number(values.steps || 0), sleep: Number(values.sleep || 0), hydration: Number(values.hydration || 0),
      nutrition_photos: values.nutrition || [], supplementation: !!values.supplementation, malasana: !!values.malasana,
      reading: Number(values.reading || 0), screentime: !!values.screentime,
      habit_points: habitPoints, points: earned,
    };
    const { error } = await sb.from("daily_checkins").upsert(row, { onConflict: "user_id,day" });
    setSaving(false);
    if (error) alert("Save failed: " + error.message); else setSaved(true);
  };

  return (
    <div style={{ marginTop: 24, borderTop: `1px solid ${C.line}`, paddingTop: 20 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
        <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 600, color: C.ink }}>Review & score a day</div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <button onClick={() => setDay(Math.max(1, day - 1))} style={{ width: 28, height: 28, borderRadius: 8, border: `1px solid ${C.line}`, background: C.surface, cursor: "pointer", color: C.ink }}>‹</button>
          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: C.ink, minWidth: 90, textAlign: "center" }}>Day {day} · {dateForDay(day)}</span>
          <button onClick={() => setDay(Math.min(currentDay(), day + 1))} style={{ width: 28, height: 28, borderRadius: 8, border: `1px solid ${C.line}`, background: C.surface, cursor: "pointer", color: C.ink }}>›</button>
        </div>
      </div>
      <div style={{ fontSize: 11, color: C.inkFaint, marginBottom: 14 }}>Points are editable per habit — adjust any value, e.g. give partial credit for sleep.</div>

      {loading ? (
        <div style={{ color: C.inkFaint, fontSize: 13 }}>Loading…</div>
      ) : (
        <React.Fragment>
          {PILLARS.map(pillar => (
            <div key={pillar.id} style={{ marginBottom: 16 }}>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 12, fontWeight: 600, color: C.inkFaint, textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>{pillar.label}</div>
              <div>
                {pillar.habits.map(h => (
                  <AdminHabitRow key={h.id} habit={h} value={values[h.id]} onChangeValue={(v) => setValue(h.id, v)}
                    points={habitPoints[h.id] ?? 0} onChangePoints={(p) => setPoints(h.id, p)} userId={client.id} day={day} />
                ))}
              </div>
            </div>
          ))}
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 10 }}>
            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: C.gold }}>{earned}/{MAX_DAILY_POINTS} pts this day</span>
            <button onClick={handleSave} disabled={saving} style={{ padding: "10px 20px", borderRadius: 10, border: "none", background: saved ? C.jungle : C.ink, color: C.paper, fontFamily: "'Space Grotesk', sans-serif", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
              {saving ? "Saving…" : saved ? "Saved ✓" : "Save this day"}
            </button>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function WeekBar({ week, points, onClick }) {
  const [grown, setGrown] = useState(false);
  useEffect(() => {
    if (points === null) return;
    const t = setTimeout(() => setGrown(true), 50 + week * 60);
    return () => clearTimeout(t);
  }, [points]);
  const pct = points === null ? 0 : Math.min(100, (points / WEEKLY_TARGET) * 100);
  const color = points === null ? C.line : points >= WEEKLY_TARGET ? C.jungle : points >= 50 ? C.gold : C.brick;
  return (
    <div onClick={() => points !== null && onClick()} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6, cursor: points !== null ? "pointer" : "default", flex: 1 }}>
      <div style={{ width: "100%", height: 110, display: "flex", alignItems: "flex-end" }}>
        <div style={{
          width: "100%", borderRadius: "6px 6px 0 0",
          height: points === null ? "3%" : grown ? `${Math.max(pct, points > 0 ? 4 : 2)}%` : "0%",
          background: color, opacity: points === null ? 0.4 : 1,
          transition: "height 0.7s cubic-bezier(.22,1,.36,1)",
        }} />
      </div>
      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, color: points === null ? C.inkFaint : C.ink }}>W{week}</span>
    </div>
  );
}

const thStyle = { padding: "8px 10px", fontSize: 10, color: C.inkFaint, textTransform: "uppercase", letterSpacing: 0.5, textAlign: "left", borderBottom: `1px solid ${C.line}`, whiteSpace: "nowrap" };
const tdStyle = { padding: "8px 10px", borderBottom: `1px solid ${C.line}`, whiteSpace: "nowrap" };

function WeekTable({ weekNum, day, byDay }) {
  const start = (weekNum - 1) * 7 + 1;
  const end = Math.min(start + 6, day);
  const rows = [];
  for (let d = start; d <= end; d++) rows.push(d);

  const cellColor = (pts, max) => {
    if (pts === undefined || pts === null) return C.line;
    if (max <= 0) return pts > 0 ? C.jungle : C.line;
    const pct = pts / max;
    if (pct >= 1) return C.jungle;
    if (pct <= 0) return C.brick;
    return C.gold;
  };

  return (
    <div style={{ overflowX: "auto", marginTop: 12, border: `1px solid ${C.line}`, borderRadius: 12 }}>
      <table style={{ borderCollapse: "collapse", width: "100%", minWidth: 760 }}>
        <thead>
          <tr>
            <th style={{ ...thStyle, position: "sticky", left: 0, background: C.surface }}>Day</th>
            {ALL_HABITS.map(h => <th key={h.id} style={thStyle}>{h.label}</th>)}
            <th style={thStyle}>Total</th>
          </tr>
        </thead>
        <tbody>
          {rows.map(d => {
            const c = byDay[d];
            const hp = c?.habit_points || {};
            return (
              <tr key={d}>
                <td style={{ ...tdStyle, position: "sticky", left: 0, background: C.surface, fontWeight: 600, fontFamily: "'Space Grotesk', sans-serif", fontSize: 12 }}>Day {d}</td>
                {ALL_HABITS.map(h => {
                  const pts = hp[h.id];
                  return (
                    <td key={h.id} style={tdStyle}>
                      {c ? (
                        <span style={{ display: "inline-block", minWidth: 26, padding: "3px 8px", borderRadius: 20, background: cellColor(pts, h.points), color: "#fff", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, textAlign: "center" }}>
                          {pts ?? 0}
                        </span>
                      ) : (
                        <span style={{ color: C.inkFaint, fontSize: 11 }}>—</span>
                      )}
                    </td>
                  );
                })}
                <td style={{ ...tdStyle, fontFamily: "'IBM Plex Mono', monospace", fontWeight: 600, fontSize: 12, color: C.ink }}>{c ? c.points : "—"}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

function WeeklyBreakdown({ client, onJumpWeek }) {
  const [checkins, setCheckins] = useState([]);
  const [physique, setPhysique] = useState([]);
  const [loading, setLoading] = useState(true);
  const [expandedWeek, setExpandedWeek] = useState(null);

  useEffect(() => {
    (async () => {
      const [{ data: dc }, { data: wc }] = await Promise.all([
        sb.from("daily_checkins").select("*").eq("user_id", client.id),
        sb.from("weekly_checkins").select("*").eq("user_id", client.id),
      ]);
      setCheckins(dc || []);
      setPhysique(wc || []);
      setLoading(false);
    })();
  }, [client.id]);

  const day = currentDay();
  const byDay = useMemo(() => { const m = {}; checkins.forEach(c => m[dayNumberFor(c.day)] = c); return m; }, [checkins]);
  const byWeek = useMemo(() => { const m = {}; physique.forEach(w => m[w.week] = w); return m; }, [physique]);

  const weeks = useMemo(() => Array.from({ length: 8 }, (_, i) => {
    const wk = i + 1;
    const start = i * 7 + 1;
    if (start > day) return { week: wk, points: null, dayStatuses: [] };
    const rows = [];
    const dayStatuses = [];
    for (let d = start; d <= Math.min(start + 6, day); d++) {
      const c = byDay[d];
      if (c) rows.push(c);
      dayStatuses.push({ d, done: !!(c && c.points > 0) });
    }
    return { week: wk, points: weeklyPointsFromRows(rows, byWeek[wk]?.points), dayStatuses };
  }), [byDay, byWeek, day]);

  if (loading) return <div style={{ color: C.inkFaint, fontSize: 13, marginTop: 24 }}>Loading weekly breakdown…</div>;

  return (
    <div style={{ marginTop: 24, borderTop: `1px solid ${C.line}`, paddingTop: 20 }}>
      <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 600, color: C.ink, marginBottom: 4 }}>Weekly breakdown</div>
      <div style={{ fontSize: 11, color: C.inkFaint, marginBottom: 16 }}>Tap a bar or a week to see the day-by-day table.</div>

      <div style={{ display: "flex", alignItems: "flex-end", gap: 10, height: 130, marginBottom: 8 }}>
        {weeks.map(w => (
          <WeekBar key={w.week} week={w.week} points={w.points} onClick={() => { setExpandedWeek(x => x === w.week ? null : w.week); onJumpWeek(w.week); }} />
        ))}
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 14 }}>
        {weeks.filter(w => w.points !== null).map(w => (
          <div key={w.week}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <button onClick={() => { setExpandedWeek(x => x === w.week ? null : w.week); onJumpWeek(w.week); }} style={{ width: 44, fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: expandedWeek === w.week ? C.gold : C.inkSoft, background: "none", border: "none", cursor: "pointer", textAlign: "left", padding: 0, fontWeight: expandedWeek === w.week ? 700 : 400 }}>Wk {w.week}</button>
              <div style={{ display: "flex", gap: 3 }}>
                {w.dayStatuses.map(ds => (
                  <span key={ds.d} title={`Day ${ds.d}`} style={{ width: 8, height: 8, borderRadius: 2, background: ds.done ? C.jungle : C.line }} />
                ))}
              </div>
              <div style={{ flex: 1 }} />
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: w.points >= WEEKLY_TARGET ? C.jungle : w.points < 50 ? C.brick : C.ink }}>{w.points}/{WEEKLY_TARGET}</span>
            </div>
            {expandedWeek === w.week && <WeekTable weekNum={w.week} day={day} byDay={byDay} />}
          </div>
        ))}
      </div>
    </div>
  );
}

function ClientDetail({ client, onBack }) {
  const [day, setDay] = useState(client.day);
  const jumpToWeek = (wk) => setDay(Math.min(currentDay(), (wk - 1) * 7 + 1));
  return (
    <div>
      <button onClick={onBack} style={{ border: "none", background: "none", cursor: "pointer", padding: 0, marginBottom: 18, fontFamily: "'Space Grotesk', sans-serif", fontSize: 13, color: C.inkSoft }}>← All clients</button>
      <div style={{ marginBottom: 20 }}>
        <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 20, fontWeight: 700, color: C.ink }}>{client.name}</div>
        <div style={{ fontSize: 12, color: C.inkFaint, marginTop: 2 }}>{client.phase} phase · Day {client.day} of {TOTAL_DAYS}</div>
      </div>
      <div style={{ display: "flex", gap: 10 }}>
        <StatChip label="Total points" value={client.totalPoints.toLocaleString()} tone="gold" />
        <StatChip label="Streak" value={`${client.streak} days`} tone="jungle" />
        <StatChip label="This week" value={`${client.weekPts}/${WEEKLY_TARGET}`} />
      </div>
      <WeeklyBreakdown client={client} onJumpWeek={jumpToWeek} />
      <AdminDayEditor client={client} day={day} setDay={setDay} />
      <AdminWeeklyPhysique client={client} />
    </div>
  );
}

function Leaderboard({ session }) {
  const [rows, setRows] = useState([]);
  const [physique, setPhysique] = useState([]);
  const [loading, setLoading] = useState(true);
  const day = currentDay();
  const weekStart = Math.floor((day - 1) / 7) * 7 + 1;
  const weekNum = weekForDay(day);

  const fetchData = async () => {
    const [{ data: dc }, { data: wc }] = await Promise.all([
      sb.from("leaderboard_data").select("*"),
      sb.from("leaderboard_physique").select("*"),
    ]);
    setRows(dc || []);
    setPhysique(wc || []);
    setLoading(false);
  };

  useEffect(() => {
    fetchData();
    const channel = sb.channel("leaderboard-updates")
      .on("postgres_changes", { event: "*", schema: "public", table: "daily_checkins" }, fetchData)
      .on("postgres_changes", { event: "*", schema: "public", table: "weekly_checkins" }, fetchData)
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, []);

  const standings = useMemo(() => {
    const byUser = {};
    rows.forEach(r => {
      if (!byUser[r.user_id]) byUser[r.user_id] = { name: r.name, rows: [] };
      const dn = dayNumberFor(r.day);
      if (dn >= weekStart && dn <= day) byUser[r.user_id].rows.push(r);
    });
    physique.forEach(w => {
      if (w.week !== weekNum || !byUser[w.user_id]) return;
      byUser[w.user_id].physiquePoints = w.points;
    });
    const list = Object.entries(byUser).map(([uid, v]) => ({
      id: uid, name: v.name,
      points: weeklyPointsFromRows(v.rows, v.physiquePoints),
    }));
    list.sort((a, b) => b.points - a.points);
    return list;
  }, [rows, physique, day]);

  const rowHeight = 58;

  if (loading) return <div style={{ color: C.inkFaint, fontSize: 13 }}>Loading leaderboard…</div>;

  return (
    <div>
      <div style={{ marginBottom: 18 }}>
        <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 18, fontWeight: 600, color: C.ink }}>This week's leaderboard</div>
        <div style={{ fontSize: 12, color: C.inkFaint, marginTop: 2 }}>Updates live as everyone checks in.</div>
      </div>
      {standings.length === 0 ? (
        <div style={{ color: C.inkFaint, fontSize: 13 }}>No check-ins yet this week.</div>
      ) : (
        <div style={{ position: "relative", height: standings.length * rowHeight }}>
          {standings.map((s, i) => {
            const isMe = s.id === session.user.id;
            const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : null;
            return (
              <div key={s.id} style={{
                position: "absolute", top: i * rowHeight, left: 0, right: 0, height: rowHeight - 10,
                transition: "top 0.7s cubic-bezier(.22,1,.36,1)",
                display: "flex", alignItems: "center", gap: 12, padding: "0 14px",
                background: isMe ? C.goldSoft : C.surface, border: `1px solid ${isMe ? C.gold : C.line}`, borderRadius: 12,
              }}>
                <span style={{ width: 28, fontSize: medal ? 17 : 13, fontFamily: "'IBM Plex Mono', monospace", color: C.inkFaint, textAlign: "center" }}>{medal || `#${i + 1}`}</span>
                <span style={{ flex: 1, fontFamily: "'Space Grotesk', sans-serif", fontSize: 14, fontWeight: isMe ? 700 : 500, color: C.ink }}>{s.name}{isMe ? " (you)" : ""}</span>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: C.gold, fontWeight: 600 }}>{s.points} pts</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function AdminView() {
  const [clients, setClients] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selected, setSelected] = useState(null);

  useEffect(() => {
    (async () => {
      const [{ data: profiles }, { data: checkins }, { data: physique }] = await Promise.all([
        sb.from("profiles").select("*").eq("is_admin", false),
        sb.from("daily_checkins").select("*"),
        sb.from("weekly_checkins").select("*"),
      ]);
      const day = currentDay();
      const today = todayStr();
      const currentWeekNum = weekForDay(day);
      const list = (profiles || []).map(p => {
        const rows = (checkins || []).filter(c => c.user_id === p.id);
        const physiqueRows = (physique || []).filter(w => w.user_id === p.id);
        const checkedInToday = rows.some(c => c.day === today);
        const byDay = {};
        rows.forEach(c => { byDay[dayNumberFor(c.day)] = c; });
        const byWeek = {};
        physiqueRows.forEach(w => { byWeek[w.week] = w; });

        let totalPoints = 0;
        let weekPts = 0;
        for (let wk = 1; wk <= currentWeekNum; wk++) {
          const start = (wk - 1) * 7 + 1;
          const end = Math.min(start + 6, day);
          const weekRows = [];
          for (let d = start; d <= end; d++) { if (byDay[d]) weekRows.push(byDay[d]); }
          const pts = weeklyPointsFromRows(weekRows, byWeek[wk]?.points);
          totalPoints += pts;
          if (wk === currentWeekNum) weekPts = pts;
        }

        let streak = 0;
        for (let d = day; d >= 1; d--) { const c = byDay[d]; if (c && c.points > 0) streak++; else break; }
        return { id: p.id, name: p.name, phase: phaseForDay(day), day, weekPts, checkedInToday, totalPoints, streak };
      });
      setClients(list);
      setLoading(false);
    })();
  }, []);

  if (loading) return <div style={{ color: C.inkFaint, fontSize: 13 }}>Loading clients…</div>;
  if (selected) return <ClientDetail client={selected} onBack={() => setSelected(null)} />;

  return (
    <div>
      <div style={{ display: "flex", gap: 10, marginBottom: 22 }}>
        <StatChip label="Active clients" value={clients.length} />
        <StatChip label="Checked in today" value={`${clients.filter(c => c.checkedInToday).length}/${clients.length}`} tone="jungle" />
        <StatChip label="Falling behind" value={clients.filter(c => c.weekPts < 70).length} tone="gold" />
      </div>
      {clients.length === 0 ? (
        <div style={{ color: C.inkFaint, fontSize: 13 }}>No clients have signed up yet.</div>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          {clients.map(c => <ClientCard key={c.id} client={c} onClick={() => setSelected(c)} />)}
        </div>
      )}
    </div>
  );
}

// ---- Auth screen ----
function AuthScreen() {
  const [mode, setMode] = useState("signup");
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError(""); setBusy(true);
    if (mode === "signup") {
      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { data: { name, phone } },
      });
      if (error) { setError(error.message); setBusy(false); return; }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) { setError(error.message); setBusy(false); return; }
    }
    setBusy(false);
  };

  return (
    <div style={{ maxWidth: 380, margin: "0 auto", padding: "4rem 1.5rem 0" }}>
      <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 26, fontWeight: 700, color: C.ink, marginBottom: 4 }}>Rewire <span style={{ color: C.gold }}>3.0</span></div>
      <div style={{ fontSize: 12, color: C.inkFaint, letterSpacing: 1.2, textTransform: "uppercase", marginBottom: 28 }}>Strong with Sherni</div>
      <div style={{ display: "flex", gap: 20, marginBottom: 20, borderBottom: `1px solid ${C.line}` }}>
        {["signup", "login"].map(m => (
          <button key={m} onClick={() => { setMode(m); setError(""); }} style={{ padding: "0 0 10px", border: "none", background: "none", cursor: "pointer", borderBottom: mode === m ? `2px solid ${C.ink}` : "2px solid transparent", color: mode === m ? C.ink : C.inkFaint, fontFamily: "'Space Grotesk', sans-serif", fontSize: 14, fontWeight: 500 }}>
            {m === "signup" ? "Join the challenge" : "Log in"}
          </button>
        ))}
      </div>
      <form onSubmit={handleSubmit} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {mode === "signup" && (
          <React.Fragment>
            <input placeholder="Your name" value={name} onChange={e => setName(e.target.value)} required style={inputStyle} />
            <input placeholder="Phone number" value={phone} onChange={e => setPhone(e.target.value)} style={inputStyle} />
          </React.Fragment>
        )}
        <input type="email" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} required style={inputStyle} />
        <input type="password" placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} required minLength={6} style={inputStyle} />
        {error && <div style={{ color: C.brick, fontSize: 12 }}>{error}</div>}
        <button type="submit" disabled={busy} style={{ marginTop: 6, padding: "14px", borderRadius: 12, border: "none", background: C.ink, color: C.paper, fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 600, cursor: "pointer" }}>
          {busy ? "Please wait…" : mode === "signup" ? "Create account" : "Log in"}
        </button>
        {mode === "signup" && <div style={{ fontSize: 11, color: C.inkFaint, textAlign: "center", marginTop: 4 }}>Check your email to confirm your account if prompted.</div>}
      </form>
    </div>
  );
}

// ---- Root app ----
function RewireApp() {
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [loadingSession, setLoadingSession] = useState(true);
  const [tab, setTab] = useState("checkin");

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => { setSession(data.session); setLoadingSession(false); });
    const { data: listener } = sb.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => listener.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) { setProfile(null); return; }
    sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle().then(({ data }) => setProfile(data));
  }, [session]);

  if (loadingSession) return <div style={{ background: C.paper, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: C.inkFaint, fontFamily: "'Space Grotesk', sans-serif" }}>Loading…</div>;

  if (!session) return <div style={{ background: C.paper, minHeight: "100vh" }}><AuthScreen /></div>;

  const tabs = [
    { id: "checkin", label: "Check-in" },
    { id: "report", label: "Report card" },
    { id: "leaderboard", label: "Leaderboard" },
    ...(profile?.is_admin ? [{ id: "admin", label: "Admin" }] : []),
  ];

  return (
    <div style={{ background: C.paper, minHeight: "100vh", padding: "0 0 3rem" }}>
      <div style={{ maxWidth: 540, margin: "0 auto", padding: "2rem 1.5rem 0" }}>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 28 }}>
          <div>
            <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 26, fontWeight: 700, color: C.ink }}>Rewire <span style={{ color: C.gold }}>3.0</span></div>
            <div style={{ fontSize: 12, color: C.inkFaint, letterSpacing: 1.2, textTransform: "uppercase", marginTop: 2 }}>Strong with Sherni</div>
          </div>
          <button onClick={() => sb.auth.signOut()} style={{ border: "none", background: "none", color: C.inkFaint, fontSize: 12, cursor: "pointer", fontFamily: "'Space Grotesk', sans-serif" }}>Log out</button>
        </div>
        <div style={{ display: "flex", gap: 24, marginBottom: 26, borderBottom: `1px solid ${C.line}` }}>
          {tabs.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)} style={{ padding: "0 0 12px", border: "none", background: "none", cursor: "pointer", borderBottom: tab === t.id ? `2px solid ${C.ink}` : "2px solid transparent", color: tab === t.id ? C.ink : C.inkFaint, fontFamily: "'Space Grotesk', sans-serif", fontSize: 14, fontWeight: 500 }}>{t.label}</button>
          ))}
        </div>
        {tab === "checkin" && <CheckIn session={session} />}
        {tab === "report" && <ReportCard session={session} />}
        {tab === "leaderboard" && <Leaderboard session={session} />}
        {tab === "admin" && profile?.is_admin && <AdminView />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<RewireApp />);
</script>
